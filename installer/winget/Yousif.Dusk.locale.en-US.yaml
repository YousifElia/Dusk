ShortDescription: Warms your screen after sunset and again before bed, then brings it back by morning.
Description: |-
  Dusk is a small Windows tray app that shifts your screen's colour temperature between 600K and 9300K
  across the day. It uses your wake time and your location's sunrise and sunset, blending each change
  over 45 minutes, and has a Darkroom mode that goes warmer still. It ships as a single 345 KB
  executable with no runtime dependencies.
