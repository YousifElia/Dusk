name: Release

# Tag a commit to publish a release:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: .\build.cmd

      - name: Test
        run: .\bin\DuskTests.exe

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist, staging | Out-Null
          Copy-Item bin\Dusk.exe, README.md, LICENSE, CHANGELOG.md staging
          Copy-Item fonts\*-OFL.txt staging
          Compress-Archive staging\* "dist\Dusk-$version-win.zip" -Force
          Get-FileHash "dist\Dusk-$version-win.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  Dusk-$version-win.zip" } |
            Out-File dist\SHA256SUMS.txt -Encoding ascii
          Get-FileHash bin\Dusk.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  Dusk.exe" } |
            Out-File dist\SHA256SUMS.txt -Append -Encoding ascii

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist\Dusk-${{ github.ref_name }}-win.zip" "bin\Dusk.exe" "dist\SHA256SUMS.txt" `
            --title "Dusk ${{ github.ref_name }}" `
            --notes "See CHANGELOG.md for what changed. Unzip and run Dusk.exe; no installer needed."
